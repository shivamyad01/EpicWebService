# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "aeeb5a0125694f9a00b74968e3d69b66"
name = "Epic Fulfill: Bulk Orders"
handle = "epic-fulfill-bulk-orders"
application_url = "https://fulfill.epicnexusgroup.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2024-10"

  [[webhooks.subscriptions]]
  uri = "/api/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  # app_subscriptions/update keeps the billing gate honest: without it a merchant
  # who just subscribed waits out the cache TTL before they can upload, and one who
  # cancelled keeps working for it. Handlers live in web/webhooks/index.js.
  #
  # These reach the app only after `shopify app deploy` — editing this file alone
  # changes nothing on Shopify's side.
  [[webhooks.subscriptions]]
  uri = "/api/webhooks"
  topics = [ "app_subscriptions/update", "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_orders,read_products,write_assigned_fulfillment_orders,write_customers,write_fulfillments,write_merchant_managed_fulfillment_orders,write_orders,write_products,write_third_party_fulfillment_orders,read_locations"

[auth]
redirect_urls = [
  "https://fulfill.epicnexusgroup.com/auth/callback",
  "https://fulfill.epicnexusgroup.com/auth/shopify/callback",
  "https://fulfill.epicnexusgroup.com/api/auth/callback"
]

[pos]
embedded = false
