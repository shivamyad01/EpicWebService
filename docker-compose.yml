services:
  # ── Shopify App ─────────────────────────────
  app:
    image: ghcr.io/shivamyad01/epicwebservice:latest
    container_name: epicfulfill-app
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=8081
      - HOST=https://fulfill.epicnexusgroup.com
    volumes:
      - app_data:/app/data
      - app_uploads:/app/uploads
    networks:
      - web
    expose:
      - "8081"

    # A healthcheck here overrides the image's own, so it has to resolve the port
    # the same way: BACKEND_PORT wins over PORT (see web/config/index.js). The $$
    # keeps the expansion for the container's shell instead of Compose's parser.
    # 127.0.0.1, not localhost — that resolves to ::1 first and the server is
    # IPv4-only, so localhost fails against a perfectly healthy app.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${BACKEND_PORT:-$${PORT:-8081}}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Nginx Reverse Proxy ─────────────────────
  nginx:
    image: nginx:alpine
    container_name: epicfulfill-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - web

# ── Volumes ───────────────────────────────────
volumes:
  app_data:
  app_uploads:

# ── Network ───────────────────────────────────
networks:
  web:
